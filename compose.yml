# Garmin-Grafana Docker Compose - Chinese Dashboard Edition
# 包含中文化仪表板，自动部署到 Grafana
#
# 使用方法:
#   1. mkdir garminconnect-tokens && chown -R 1000:1000 garminconnect-tokens
#   2. docker compose run --rm garmin-fetch-data  (首次登录 Garmin)
#   3. docker compose up -d  (启动所有服务)
#   4. 浏览器打开 http://localhost:3000  (admin/admin)

services:
  garmin-fetch-data:
    restart: unless-stopped
    image: thisisarpanghosh/garmin-fetch-data:latest
    container_name: garmin-fetch-data
    depends_on:
      - influxdb
    volumes:
      - ./garminconnect-tokens:/home/appuser/.garminconnect
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USERNAME=influxdb_user
      - INFLUXDB_PASSWORD=influxdb_secret_password
      - INFLUXDB_DATABASE=GarminStats
      - GARMINCONNECT_IS_CN=False
      # 取消注释并填入你的 Garmin 账号信息 (密码需要 Base64 编码)
      # - GARMINCONNECT_EMAIL=your_email@example.com
      # - GARMINCONNECT_BASE64_PASSWORD=your_base64_encoded_password

  influxdb:
    restart: unless-stopped
    container_name: influxdb
    hostname: influxdb
    environment:
      - INFLUXDB_DB=GarminStats
      - INFLUXDB_USER=influxdb_user
      - INFLUXDB_USER_PASSWORD=influxdb_secret_password
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    expose:
      - '8086'
    volumes:
      - influxdb_data:/var/lib/influxdb
    image: 'influxdb:1.11'

  grafana:
    restart: unless-stopped
    container_name: grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_PREINSTALL=marcusolsson-hourly-heatmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Grafana_Datasource:/etc/grafana/provisioning/datasources
      - ./Grafana_Dashboard:/etc/grafana/provisioning/dashboards
    ports:
      - '3000:3000'
    image: 'grafana/grafana:latest'

volumes:
  influxdb_data:
  grafana_data:
